# Android APK + Google Play AAB derlemesi (Capacitor). Commit mesajında [apk] geçince ya da elle (workflow_dispatch) çalışır.
# Çıktı: Actions sayfasında "artifact" olarak ve depo Releases sayfasında "apk-guncel" etiketiyle.
name: Android apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BESTE_VERSION_CODE: ${{ github.run_number }}
      BESTE_VERSION_NAME: 1.0.${{ github.run_number }}
      NAME: Beste-Sihirli-Dunya
      HAS_KS_SECRET: ${{ secrets.APK_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Ubuntu sunucusunda Android SDK hazır kurulu ($ANDROID_HOME); eksik platform varsa eklenir
      - name: Android SDK parçaları
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Oyun dosyalarını hazırla
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node prepare.mjs ..
          npx cap sync android

      # İmza anahtarı depoda değil. Depo sırlarında APK_KEYSTORE_B64 + APK_KEYSTORE_PASS varsa onlar kullanılır;
      # yoksa ilk derlemede bir anahtar üretilip Actions önbelleğinde saklanır (sonraki apk'lar aynı anahtarla
      # imzalanır, eskisinin üstüne kurulur).
      - name: İmza anahtarı (önbellek)
        if: env.HAS_KS_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.beste-imza
          key: apk-imza-v1

      - name: İmza anahtarı
        shell: bash
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          d="$HOME/.beste-imza"
          mkdir -p "$d"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$d/sirdan.jks"
            echo "BESTE_KS_PATH=$d/sirdan.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_PASS"
            echo "BESTE_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            if [ ! -f "$d/beste.jks" ]; then
              head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > "$d/pass"
              keytool -genkeypair -keystore "$d/beste.jks" -alias beste -storepass "$(cat "$d/pass")" -keypass "$(cat "$d/pass")" \
                -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Beste Sihirli Dunya, O=kartal1d, C=TR"
              echo "yeni imza anahtarı üretildi"
            fi
            echo "::add-mask::$(cat "$d/pass")"
            echo "BESTE_KS_PATH=$d/beste.jks" >> "$GITHUB_ENV"
            echo "BESTE_KS_PASS=$(cat "$d/pass")" >> "$GITHUB_ENV"
          fi

      - name: Derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ "$HAS_KS_SECRET" = "true" ]; then
            # Google Play için: AAB yalnız kullanıcının kendi yükleme anahtarıyla (depo sırları) imzalanır
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/bundle/release/app-release.aab "../dist/$NAME.aab"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "::warning::APK_KEYSTORE_B64 / APK_KEYSTORE_PASS depo sırları yok: Google Play için AAB derlenmedi."
          fi
          cp app/build/outputs/apk/release/app-release.apk "../dist/$NAME.apk"
          # imza sertifikasının parmak izi (Play Console'daki yükleme sertifikasıyla aynı olmalı)
          keytool -list -v -keystore "$BESTE_KS_PATH" -storepass "$BESTE_KS_PASS" | grep -E "SHA256:" | head -1 | sed 's/^[[:space:]]*//' > ../dist/imza.txt
          cat ../dist/imza.txt
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-apk
          path: |
            mobile/dist/*.apk
            mobile/dist/*.aab
          retention-days: 30

      - name: Releases sayfasına koy
        run: |
          cat > notes.md <<'EOF'
          **Android (telefon / tablet) için indir ve kur:**
          - `Beste-Sihirli-Dunya.apk` dosyasını telefona indir ve aç.
          - "Bilinmeyen kaynaklardan yükleme" izni sorulursa tarayıcına / dosya yöneticine izin ver.
          - Play Protect uyarı verirse **Yine de yükle**'ye dokun (uygulama Play Store dışından geldiği için çıkar).

          Telefonu yatay tut. Sol başparmakla yürü, sağ tarafı sürükleyerek etrafa bak, sağ tarafa dokunarak etkileşime gir.
          Yeni sürüm eskisinin üstüne kurulur, kaydın silinmez. Kulaklıkla ve karanlıkta oynayın.

          **Google Play:** `Beste-Sihirli-Dunya.aab` dosyasını Play Console'a yükle (yalnızca yükleme anahtarı depo sırlarına eklendiyse bulunur).
          EOF
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "İmza sertifikası $(cat mobile/dist/imza.txt)" >> notes.md
          echo "Sürüm: $BESTE_VERSION_NAME (sürüm kodu $BESTE_VERSION_CODE)" >> notes.md
          gh release delete apk-guncel --cleanup-tag -y || true
          gh release create apk-guncel mobile/dist/*.apk $(ls mobile/dist/*.aab 2>/dev/null) --target "$GITHUB_SHA" --title "Beste'nin Sihirli Dünyası: Android (apk / aab)" --notes-file notes.md --prerelease
